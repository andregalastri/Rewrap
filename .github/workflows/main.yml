name: Build VSIX

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DOTNET_ROLL_FORWARD: Major
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json

      - name: Install build dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix vscode

      - name: Restore Fable tool
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore core/Core.Test.fsproj

      - name: Build, test and package
        run: sh ./do package --verbose

      - name: Test VS Code commands
        run: xvfb-run -a node vscode.test/run.cjs

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: Rewrap-VSCode
          path: .obj/Rewrap-VSCode.vsix
          if-no-files-found: error
          retention-days: 30
